name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.2.3) - tag must already exist"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version to release (e.g., v1.2.3) - tag must already exist"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ===========================================================================
  # Build every platform and publish the GitHub Release in one goreleaser run.
  # tm2 needs no cgo (CGO_ENABLED=0), so nothing needs a native runner.
  # ===========================================================================
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # goreleaser derives the version from the checked-out tag, so the full
          # history (and its tags) has to be here.
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format '$VERSION'"
            echo "Expected format: vX.Y.Z (e.g., v1.2.3)"
            exit 1
          fi
          echo "Version format valid: $VERSION"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The release is immutable once published, so the bundle must exist
      # before goreleaser publishes it. goreleaser builds once for the bundle,
      # and again for the release, which attaches it from .mcpb-build/.
      - name: Build the binaries for the MCP bundle
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Pinned exactly (not "~> v2"): goreleaser 2.18.0 attests every build
          # artifact, which fails this job. 2.17.1 is the last release before that.
          version: "2.17.1"
          args: build --clean

      # The bundle installs tm2 in Claude Desktop, which runs on macOS and
      # Windows. Windows on arm64 runs the amd64 binary.
      - name: Build the MCP bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          binary() {
            jq -er --arg goos "$1" --arg goarch "$2" \
              'first(.[] | select(.goos == $goos and .goarch == $goarch and (.type == "Binary" or .type == "Universal Binary")) | .path)' \
              dist/artifacts.json
          }
          mkdir -p .mcpb-build/bundle/server
          cp "$(binary darwin all)" .mcpb-build/bundle/server/tm2
          cp "$(binary windows amd64)" .mcpb-build/bundle/server/tm2.exe
          cp .github/assets/icon.png .mcpb-build/bundle/icon.png
          jq --arg v "${VERSION#v}" '.version = $v' mcpb/manifest.json > .mcpb-build/bundle/manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 validate .mcpb-build/bundle/manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack .mcpb-build/bundle .mcpb-build/tm2.mcpb

      - name: Build and publish release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
