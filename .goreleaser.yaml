# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: tm2

before:
  hooks:
    - go mod tidy

builds:
  # Pure Go: every platform cross-compiles.
  - id: tm2
    main: ./cmd/tm2
    binary: tm2
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      # tm2 --version reports the release, not the go install version.
      - -s -w -X main.version={{ .Version }}

universal_binaries:
  # One macOS binary for the MCP bundle, which has no way to pick a binary by
  # CPU. The archives keep a binary per CPU.
  - id: tm2-universal
    ids:
      - tm2
    replace: false

archives:
  - id: default
    ids:
      - tm2
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  extra_files:
    # Built by release.yml before this runs.
    - glob: ./.mcpb-build/tm2.mcpb

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: mpyw
    name: tepra.tm2
  draft: false
  extra_files:
    # Built by release.yml before this runs.
    - glob: ./.mcpb-build/tm2.mcpb
